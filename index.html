<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coming Soon</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }
    .countdown {
      display: flex;
      gap: 15px;
      font-size: 2rem;
    }
    .countdown div {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      border-radius: 10px;
      min-width: 80px;
    }
    .label {
      display: block;
      font-size: 0.8rem;
      margin-top: 5px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <h1>Coming Soon</h1>
  <div class="countdown">
    <div><span id="days">0</span><span class="label">Days</span></div>
    <div><span id="hours">0</span><span class="label">Hours</span></div>
    <div><span id="minutes">0</span><span class="label">Minutes</span></div>
    <div><span id="seconds">0</span><span class="label">Seconds</span></div>
  </div>

  <script>
    // Target date: 15 August 2025, 23:59:59
    const targetDate = new Date("2025-08-15T23:59:59+10:00"); // Adjust timezone if needed

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate.getTime() - now;

      if (distance <= 0) {
        document.querySelector("h1").innerText = "We're Live!";
        document.querySelector(".countdown").style.display = "none";
        clearInterval(interval);
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = hours;
      document.getElementById("minutes").innerText = minutes;
      document.getElementById("seconds").innerText = seconds;
    }

    const interval = setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
